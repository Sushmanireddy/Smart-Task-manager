<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <h1>Smart Task Manager</h1>
                <p>Organize your tasks. Stay productive.</p>
            </div>

            <button id="themeBtn">🌙</button>
        </header>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>

            <div class="stat-card">
                <h3 id="highTasks">0</h3>
                <p>High Priority</p>
            </div>

        </section>


        <!-- Add Task -->
        <section class="task-form">

            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter task name"
            >

            <input
                type="text"
                id="descriptionInput"
                placeholder="Enter task description"
            >

            <div class="form-row">

                <input
                    type="date"
                    id="dueDateInput"
                >

                <select id="priorityInput">

                    <option value="Low">Low Priority</option>

                    <option value="Medium">
                        Medium Priority
                    </option>

                    <option value="High">
                        High Priority
                    </option>

                </select>

                <select id="categoryInput">

                    <option value="College">College</option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Work">
                        Work
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

            <button id="addTaskBtn">
                + Add Task
            </button>

        </section>


        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >

        </section>


        <!-- Filters -->
        <section class="filters">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

            <button class="filter-btn" data-filter="high">
                High Priority
            </button>

        </section>


        <!-- Task List -->
        <section>

            <div id="taskList">

                <!-- Tasks will appear here using JavaScript -->

            </div>

            <button id="clearCompletedBtn">
                Clear Completed Tasks
            </button>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
